<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- Same avatar the blog at pochunyeh.com uses, so both tabs look alike -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnglishProject — 英文學習</title>
    <script>
      // Apply theme before first paint to avoid flash of wrong theme.
      // Mirrors next-themes storage: localStorage "theme" = "light" | "dark" | "system".
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'dark' || ((t === null || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) { /* storage unavailable: default light */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
